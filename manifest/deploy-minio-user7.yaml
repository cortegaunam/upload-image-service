apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-deploy-user7
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      #initContainers:
      #  - name: create-bucket
      #    image: minio/mc
      #    command: ['sh', '-c', 'until (mc alias set myminio http://minio-service-user7:9000 miniouser miniopass && mc mb myminio/uploaded-image); do echo "Waiting for minio-service ..."; sleep 5; done']
      containers:
      - name: minio-container
        image: minio/minio:RELEASE.2024-10-13T13-34-11Z        
        ports:
        - containerPort: 9000
        - containerPort: 9001
        env:
        - name: MINIO_ROOT_USER
          value: miniouser
        - name: MINIO_ROOT_PASSWORD
          value: miniopass
        args: 
          - server
          - /data
          - --console-address
          - ":9001"

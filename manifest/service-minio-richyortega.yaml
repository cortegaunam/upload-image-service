apiVersion: v1
kind: Service
metadata:
  name: minio-service-richyortega
spec:
  selector:
    app: minio-richyortega
  ports:
    - name: minio
      protocol: TCP
      port: 9000
      targetPort: 9000
    - name: console
      protocol: TCP
      port: 9001
      targetPort: 9001
  type: NodePort

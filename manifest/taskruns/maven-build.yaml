apiVersion: tekton.dev/v1beta1
kind: TaskRun
metadata:
  generateName: build-maven-java17-
  namespace: diploe2-cror
spec:
  taskRef:
    name: maven  # Use the official Maven Task
  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: workspace
    - name: maven-settings
      emptyDir: {}  # Use emptyDir if no custom settings.xml is needed
  params:
    - name: GOALS
      value: ["clean", "package", "-DskipTests"]
    - name: MAVEN_IMAGE
      value: "maven:3.9.9-eclipse-temurin-17-alpine"  # Java 17 Maven image #value: "3.9-eclipse-temurin-17"  # Java 17 Maven image
